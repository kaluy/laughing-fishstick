<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Map Watch — new Fortnite maps crossing the line</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0C1017; --panel:#141B26; --panel-2:#101722; --edge:#22303f;
    --text:#E6EDF3; --muted:#7C8BA0; --faint:#4d5b6d;
    --cyan:#35E0C8; --coral:#FF6B5B; --amber:#FFB347;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Space Grotesk",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--disp);
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(53,224,200,.06), transparent 60%);
  }
  a{color:inherit}
  .wrap{max-width:960px; margin:0 auto; padding:28px 20px 64px}

  header{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px}
  .brand{display:flex; align-items:center; gap:12px}
  .pulse{width:10px; height:10px; border-radius:50%; background:var(--cyan); box-shadow:0 0 0 0 rgba(53,224,200,.6); animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,224,200,.5)}70%{box-shadow:0 0 0 12px rgba(53,224,200,0)}100%{box-shadow:0 0 0 0 rgba(53,224,200,0)}}
  h1{font-size:22px; font-weight:700; letter-spacing:-.01em; margin:0}
  .tag{font-family:var(--mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.16em}

  .rule{font-family:var(--mono); font-size:13px; color:var(--muted); margin:18px 0 22px}
  .rule b{color:var(--amber); font-weight:700}
  .rule .n{color:var(--cyan)}

  .strip{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:26px}
  .stat{background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:12px 14px}
  .stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
  .stat .v{font-family:var(--mono); font-size:19px; font-weight:700; margin-top:6px}
  .ok{color:var(--cyan)} .bad{color:var(--coral)} .warn{color:var(--amber)}

  .section-label{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin:0 0 12px}

  .card{background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:16px 18px; margin-bottom:12px; transition:border-color .25s}
  .card.alerted{border-color:rgba(255,107,91,.55); background:linear-gradient(180deg, rgba(255,107,91,.06), transparent 55%), var(--panel)}
  .card-top{display:flex; justify-content:space-between; gap:14px; align-items:flex-start}
  .title{font-size:16px; font-weight:600; letter-spacing:-.01em; line-height:1.25}
  .meta{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:5px}
  .meta .code{color:var(--text)}
  .ccu{text-align:right; white-space:nowrap}
  .ccu .num{font-family:var(--mono); font-size:26px; font-weight:700; line-height:1}
  .ccu .num.hot{color:var(--coral)} .ccu .num.live{color:var(--cyan)} .ccu .num.dim{color:var(--muted)}
  .ccu .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:4px}

  .card-main{display:flex; gap:14px; align-items:flex-start}
  .thumb{width:128px; height:72px; border-radius:8px; object-fit:cover; background:var(--panel-2); border:1px solid var(--edge); flex:none}
  .card-body{flex:1; min-width:0}

  .trend{margin-top:13px; padding:11px 13px; background:var(--panel-2); border:1px solid var(--edge); border-left:2px solid var(--amber); border-radius:8px}
  .trend .lab{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber)}
  .trend .origin{font-weight:600; font-size:14px; margin-top:4px}
  .trend .idea{color:var(--muted); font-size:13px; margin-top:5px; line-height:1.45}
  .trend .src{font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:7px}

  /* the signature: a CCU meter with the 200-line marked on it */
  .meter{position:relative; height:8px; border-radius:6px; background:var(--panel-2); border:1px solid var(--edge); margin-top:14px; overflow:hidden}
  .meter .fill{position:absolute; inset:0 auto 0 0; border-radius:6px 0 0 6px; background:var(--cyan)}
  .meter .fill.hot{background:var(--coral)}
  .thresh{position:relative; height:14px; margin-top:2px}
  .thresh .mark{position:absolute; top:0; transform:translateX(-50%); font-family:var(--mono); font-size:9px; color:var(--amber); letter-spacing:.08em}
  .thresh .mark::before{content:""; position:absolute; top:-16px; left:50%; width:1px; height:14px; background:var(--amber); opacity:.7}

  .pill{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border-radius:999px; border:1px solid; display:inline-block}
  .pill.watch{color:var(--cyan); border-color:rgba(53,224,200,.4)}
  .pill.alert{color:var(--coral); border-color:rgba(255,107,91,.5)}
  .pill.below{color:var(--muted); border-color:var(--edge)}
  .chip{font-family:var(--mono); font-size:11px; color:var(--muted)}

  .row-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px}

  .empty{border:1px dashed var(--edge); border-radius:12px; padding:40px 24px; text-align:center; color:var(--muted)}
  .empty .big{font-size:15px; color:var(--text); margin-bottom:6px}

  footer{margin-top:30px; font-family:var(--mono); font-size:11px; color:var(--faint)}

  @media (max-width:620px){ .strip{grid-template-columns:repeat(2,1fr)} h1{font-size:19px} }
  @media (prefers-reduced-motion:reduce){ .pulse{animation:none} .card{transition:none} }
  :focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="pulse" aria-hidden="true"></span>
      <h1>Map Watch</h1>
    </div>
    <span class="tag">Fortnite new-map CCU monitor</span>
  </header>

  <p class="rule" id="rule">Loading watch rules…</p>

  <div class="strip">
    <div class="stat"><div class="k">Last scan</div><div class="v" id="s-last">—</div></div>
    <div class="stat"><div class="k">Maps scanned</div><div class="v" id="s-scan">—</div></div>
    <div class="stat"><div class="k">Alerts sent</div><div class="v ok" id="s-alerts">—</div></div>
    <div class="stat"><div class="k">Discord</div><div class="v" id="s-discord">—</div></div>
  </div>

  <p class="section-label">New maps in view</p>
  <div id="list"></div>

  <footer id="foot">Auto-refreshing every 15s · not affiliated with Epic Games</footer>
</div>

<script>
const THRESH_KEY = { value: 200 };

function timeAgo(iso){
  if(!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return s + "s ago";
  if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}

async function loadStatus(){
  const s = await fetch("/api/status").then(r=>r.json());
  THRESH_KEY.value = s.ccuThreshold;
  document.getElementById("rule").innerHTML =
    `Watching for maps <span class="n">≤ ${s.maxMapAgeDays} days</span> old that reach ` +
    `<b>${s.ccuThreshold}+</b> concurrent players. Scanning every ${s.pollIntervalMinutes} min.`;
  document.getElementById("s-last").textContent = s.lastPollOk === false ? "error" : timeAgo(s.lastPollAt);
  document.getElementById("s-last").className = "v " + (s.lastPollOk === false ? "bad" : "");
  document.getElementById("s-scan").textContent = s.scanned ?? "—";
  const dis = document.getElementById("s-discord");
  dis.textContent = s.discordConfigured ? "connected" : "not set";
  dis.className = "v " + (s.discordConfigured ? "ok" : "warn");
  return s;
}

async function loadMaps(){
  const maps = await fetch("/api/maps").then(r=>r.json());
  const thr = THRESH_KEY.value;
  const alerts = maps.filter(m=>m.alerted).length;
  document.getElementById("s-alerts").textContent = alerts;

  const list = document.getElementById("list");
  if(!maps.length){
    list.innerHTML = `<div class="empty"><div class="big">No new maps in view yet.</div>
      Freshly published maps show up here as the tracker scans. When one crosses the line, it lights up.</div>`;
    return;
  }

  list.innerHTML = maps.map(m=>{
    const ccu = m.peakCcu;
    const known = ccu !== null && ccu !== undefined;
    const hot = known && ccu >= thr;
    const scaleMax = Math.max(thr * 1.5, ccu || 0);
    const fillPct = known ? Math.min(100, (ccu/scaleMax)*100) : 0;
    const threshPct = Math.min(100, (thr/scaleMax)*100);
    const status = m.alerted ? ["alert","Alerted"] : hot ? ["alert","Over the line"] :
                   known ? ["below","Below "+thr] : ["watch","Watching"];
    const numClass = m.alerted || hot ? "hot" : known ? "live" : "dim";
    const ageBasis = m.hasPublishDate ? "published" : "first seen";
    const thumb = m.image
      ? `<img class="thumb" src="${escapeHtml(m.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : "";
    const trend = m.trend ? `
        <div class="trend">
          <div class="lab">Based on</div>
          <div class="origin">${escapeHtml(m.trend.origin || "unknown")}</div>
          ${m.trend.idea ? `<div class="idea">${escapeHtml(m.trend.idea)}</div>` : ""}
          <div class="src">${escapeHtml(m.trend.confidence || "")} confidence · ${escapeHtml(m.trend.source || "")}</div>
        </div>` : "";
    return `
      <div class="card ${m.alerted?"alerted":""}">
        <div class="card-main">
          ${thumb}
          <div class="card-body">
            <div class="card-top">
              <div>
                <div class="title">${escapeHtml(m.title)}</div>
                <div class="meta">by ${escapeHtml(m.creator||"unknown")} · <span class="code">${escapeHtml(m.code)}</span></div>
              </div>
              <div class="ccu">
                <div class="num ${numClass}">${known ? ccu.toLocaleString() : "—"}</div>
                <div class="lbl">live CCU</div>
              </div>
            </div>
          </div>
        </div>
        <div class="meter"><div class="fill ${hot?"hot":""}" style="width:${fillPct}%"></div></div>
        <div class="thresh"><span class="mark" style="left:${threshPct}%">${thr}</span></div>
        ${trend}
        <div class="row-foot">
          <span class="chip">${m.ageDays.toFixed(1)}d old · ${ageBasis}</span>
          <span class="pill ${status[0]}">${status[1]}</span>
        </div>
      </div>`;
  }).join("");
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function tick(){ try{ await loadStatus(); await loadMaps(); }catch(e){ console.error(e); } }
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
